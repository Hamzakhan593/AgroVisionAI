name: AgroVisionAI CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-check:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check committed files
        run: python3 scripts/check_repository.py --tracked-only
      - name: Test repository checker
        run: python3 scripts/test_repository_check.py

  dotnet-build:
    name: ASP.NET Core build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore AgroVisionAI/AgroVisionAI.csproj

      - name: Build
        run: dotnet build AgroVisionAI/AgroVisionAI.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish AgroVisionAI/AgroVisionAI.csproj --configuration Release --no-build --output ./artifacts/web

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: agrovisionai-web
          path: ./artifacts/web
          if-no-files-found: error
          retention-days: 7

  python-tests:
    name: FastAPI unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AgroVisionAI/AIService
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            AgroVisionAI/AIService/requirements.txt
            AgroVisionAI/AIService/requirements-dev.txt

      # Unit tests mock model loading, so TensorFlow weights are not required in CI.
      # Installing this lightweight set keeps feedback fast while covering API/routing logic.
      - name: Install test dependencies
        run: >-
          python -m pip install
          "fastapi>=0.115,<1.0"
          "uvicorn[standard]>=0.34,<1.0"
          "python-multipart>=0.0.20,<1.0"
          "Pillow>=11,<13"
          "numpy>=1.26,<3.0"
          "httpx>=0.28,<1.0"
          "pytest>=8,<10"

      - name: Run tests
        run: python -m pytest -q

  docker-build:
    name: Validate Docker images
    runs-on: ubuntu-latest
    needs: [ dotnet-build, python-tests ]
    # Docker image validation is most useful after code reaches a branch, and avoids
    # making every pull request install the large TensorFlow runtime image.
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ASP.NET image
        run: docker build -t agrovisionai-web:ci ./AgroVisionAI

      - name: Build FastAPI image
        run: docker build -t agrovisionai-ai:ci ./AgroVisionAI/AIService
